<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Screening Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Resume Screener</h1>
            <p>Upload a resume and paste a job description to get an instant AI-powered match score</p>
        </div>

        <div class="card">
            <form action="/analyze" method="POST" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label>📄 Upload Resume (PDF or TXT)</label>
                    <div class="upload-area" onclick="document.getElementById('resume').click()">
                        <input type="file" id="resume" name="resume" accept=".pdf,.txt" required hidden>
                        <div class="upload-icon">📁</div>
                        <p id="file-label">Click to upload resume</p>
                        <small>Supported: PDF, TXT (Max 16MB)</small>
                    </div>
                </div>

                <div class="form-group">
                    <label>💼 Job Description</label>
                    <textarea 
                        name="job_description" 
                        placeholder="Paste the job description here...&#10;&#10;Example: We are looking for a DevOps Engineer with experience in Azure, Kubernetes, Docker, Terraform and CI/CD pipelines..."
                        required
                        rows="8"
                    ></textarea>
                </div>

                <button type="submit" class="btn">
                    🔍 Analyze Resume
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('resume').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || 'Click to upload resume';
            document.getElementById('file-label').textContent = '✅ ' + fileName;
        });
    </script>
</body>
</html>
